name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.STAGING_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # .env, storage/ and public/storage live only on the server, so they are never overwritten or deleted.
      - name: Upload files
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.STAGING_SSH_PORT }}" \
            --exclude=/.git/ \
            --exclude=/.github/ \
            --exclude=/node_modules/ \
            --exclude=/tests/ \
            --exclude=/.env \
            --exclude=/storage/ \
            --exclude=/public/storage \
            ./ ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }}:~/bookstore/

      - name: Migrate and cache
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.STAGING_SSH_PORT }} \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} \
            'cd ~/bookstore && php artisan migrate --force && ([ -L public/storage ] || php artisan storage:link) && php artisan optimize'
